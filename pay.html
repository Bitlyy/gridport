<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление на оплату...</title>
    <script>
        window.onload = function() {
            // Получаем ссылку из адресной строки
            const urlParams = new URLSearchParams(window.location.search);
            const paymentLink = urlParams.get('link');

            // Защита: перекидываем только если это реальная ссылка AnyPay
            if (paymentLink && paymentLink.startsWith('https://anypay.io/')) {
                window.location.replace(paymentLink);
            } else {
                window.location.replace('/'); // Иначе кидаем на главную
            }
        };
    </script>
</head>
<body style="background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <p>Загрузка кассы...</p>
</body>
</html>
